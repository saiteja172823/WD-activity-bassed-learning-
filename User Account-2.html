<!DOCTYPE html>
<html>
<head>
    <title>User Account</title>
</head>
<body style="background-color:lightblue;">

    <h1 align="center">User Account Portal</h1>

    <h2>Registration</h2>
    <form>
        Name: <input type="text" required><br><br>
        Email: <input type="email" required><br><br>
        Password: <input type="password" required><br><br>
        <input type="submit" value="Register">
    </form>

    <hr>

    <h2>Login</h2>
    <form>
        Email: <input type="email" required><br><br>
        Password: <input type="password" required><br><br>
        <input type="submit" value="Login">
    </form>

    <hr>

    <h2>Forgot Password</h2>
    <form>
        Email: <input type="email" required><br><br>
        <input type="submit" value="Recover Password">
    </form>

    <hr>

    <h2>Profile Setup</h2>
    <form>
        Username: <input type="text" required><br><br>
        Phone: <input type="tel" required><br><br>
        Address: <input type="text"><br><br>
        <input type="submit" value="Save Profile">
    </form>

</body>
</html>
